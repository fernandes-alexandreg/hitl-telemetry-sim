[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-telemetry-sim"
version = "0.1.0"
description = "Reusable source package for HITL telemetry simulations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "catboost",
  "joblib",
  "numpy",
  "pandas",
  "plotly",
  "scikit-learn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
